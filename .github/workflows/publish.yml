name: Publish Arcade Hub website
on:
  workflow_dispatch:
# Configure an AWS OIDC role restricted to this repository and the main branch.
# No AWS access keys belong in GitHub secrets. This workflow publishes static assets;
# infrastructure changes use the reviewed CloudFormation change-set process.
permissions:
  contents: read
  id-token: write
concurrency:
  group: arcade-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: arcade-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.ARCADE_PUBLISH_ROLE_ARN }}
          aws-region: ap-southeast-2
      - run: npm run aws:publish
        env:
          AWS_REGION: ap-southeast-2
          ARCADE_STACK: arcade-hub
